<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testing AI · Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            ink: '#030712',
                            dusk: '#0f172a',
                            foam: '#0ea5e9',
                            mint: '#10b981',
                            gold: '#fbbf24'
                        }
                    },
                    fontFamily: {
                        display: ['IBM Plex Sans', 'sans-serif'],
                        body: ['IBM Plex Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script>
        // Prevent dev live-reload scripts from aborting in-flight chat requests.
        (function blockAutoReload() {
            try {
                if (typeof window === 'undefined') {
                    return;
                }

                const NativeWebSocket = window.WebSocket;
                if (typeof NativeWebSocket === 'function') {
                    window.WebSocket = function (...args) {
                        const ws = new NativeWebSocket(...args);
                        const url = String(args[0] || '');
                        const isLiveReloadSocket = /\/ws(\?|$)/i.test(url) || /livereload/i.test(url);

                        if (!isLiveReloadSocket) {
                            return ws;
                        }

                        const nativeAdd = ws.addEventListener.bind(ws);
                        ws.addEventListener = function (type, listener, options) {
                            if (type !== 'message' || typeof listener !== 'function') {
                                return nativeAdd(type, listener, options);
                            }
                            const wrapped = function (event) {
                                const data = String(event?.data || '');
                                if (data.includes('reload') || data.includes('refreshcss')) {
                                    console.warn('[Landing] Blocked live-reload websocket message.', data);
                                    return;
                                }
                                return listener.call(this, event);
                            };
                            return nativeAdd(type, wrapped, options);
                        };

                        let assignedOnMessage = null;
                        Object.defineProperty(ws, 'onmessage', {
                            configurable: true,
                            enumerable: true,
                            get() {
                                return assignedOnMessage;
                            },
                            set(handler) {
                                assignedOnMessage = handler;
                                if (typeof handler !== 'function') {
                                    return;
                                }
                                nativeAdd('message', function (event) {
                                    const data = String(event?.data || '');
                                    if (data.includes('reload') || data.includes('refreshcss')) {
                                        console.warn('[Landing] Blocked live-reload onmessage event.', data);
                                        return;
                                    }
                                    handler.call(ws, event);
                                });
                            },
                        });

                        return ws;
                    };
                    window.WebSocket.prototype = NativeWebSocket.prototype;
                }

                const originalReload = window.location?.reload?.bind(window.location);
                if (typeof originalReload === 'function') {
                    window.__manualPageReload = originalReload;
                    window.location.reload = function (...reloadArgs) {
                        const stack = new Error().stack || '';
                        const likelyLiveReload = stack.includes('socket.onmessage') || stack.includes('livereload');
                        if (likelyLiveReload) {
                            console.warn('[Landing] Blocked auto reload from live-reload stack.', { reloadArgs });
                            return;
                        }
                        return originalReload(...reloadArgs);
                    };
                }
            } catch (error) {
                console.warn('[Landing] Failed to install auto-reload guard:', error);
            }
        })();
    </script>
</head>
<body class="h-screen overflow-hidden bg-slate-50 text-slate-900 dark:bg-brand-ink dark:text-slate-100 transition-colors">
    <div class="glow bg-brand-foam/25 -top-40 left-1/3"></div>
    <div class="glow bg-brand-leaf/20 bottom-0 right-0"></div>

    <div class="relative z-10 h-screen flex overflow-hidden">
        <aside class="console-sidebar glass-panel card-shadow" data-sidebar data-collapsed="false">
            <div class="sidebar-top">
                <a href="index.html" class="sidebar-brand" data-sidebar-brand>
                    <img src="assets/logo/landbank-logo.png" alt="LandBank logo" class="sidebar-logo">
                    <div class="sidebar-brand-text">
                        <span class="sidebar-brand-title">Testing AI</span>
                        <span class="sidebar-brand-tagline">Anti-Fraud Console</span>
                    </div>
                </a>
            </div>
            <nav class="sidebar-nav" aria-label="Primary">
                <a href="#console" class="sidebar-link is-active">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="6" y="6" width="12" height="12" rx="3"></rect>
                            <path d="M9 9h6v6H9z"></path>
                        </svg>
                    </span>
                    <span class="sidebar-label">Console</span>
                </a>
                <a href="pages/templates.html" class="sidebar-link">
                    <span class="nav-icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M7 4h7l4 4v12H7z"></path>
                            <path d="M14 4v4h4"></path>
                            <path d="M10 12h6"></path>
                            <path d="M10 16h6"></path>
                        </svg>
                    </span>
                    <span class="sidebar-label">Templates</span>
                </a>
            </nav>
            <div class="sidebar-divider" aria-hidden="true"></div>
            <section class="chat-history" aria-label="Chat history">
                <div class="chat-history__header">
                    <p class="chat-history__eyebrow">Chat history</p>
                    <button id="new-chat-btn" type="button" class="chat-history__new">+ New Chat</button>
                </div>
                <div class="chat-history__list">
                    <ul id="conversation-list" class="chat-thread" role="list"></ul>
                </div>
            </section>
            <div class="sidebar-meta">
                <p>Anti-Fraud Desk</p>
                <p>© <span id="year"></span> Testing AI</p>
            </div>
            <a href="index.html" class="sidebar-logout" aria-label="Logout">
                Logout
            </a>
            <button type="button" class="sidebar-fab" aria-label="Collapse sidebar" data-sidebar-toggle data-direction="collapse">
                <span class="sidebar-fab__icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 6l6 6-6 6"></path>
                    </svg>
                </span>
            </button>
        </aside>

        <div class="flex-1 flex flex-col min-h-0">
            <main class="console-main flex-1 min-h-0">
                <section id="console" class="console-stage min-h-0">
                    <div class="console-frame glass-panel card-shadow">
                        <div class="conversation-feed" aria-live="polite">
                            <div class="conversation-feed__viewport">
                                <div id="feed-placeholder" class="conversation-feed__empty">
                                    <p>Drafts and CFIR answers will appear here. Pin your prompt below to begin.</p>
                                </div>
                                <div id="result-container" class="conversation-feed__results"></div>
                            </div>
                        </div>

                        <form id="prompt-form" class="prompt-dock" novalidate>
                            <div id="backend-status" class="mb-3 rounded-xl border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-700 dark:border-amber-400/30 dark:bg-amber-400/10 dark:text-amber-200" role="status" aria-live="polite">
                                Checking backend status...
                            </div>
                            <div class="prompt-template-row">
                                <label for="template-select" class="sr-only">Choose template</label>
                                <select id="template-select" class="rounded-full border border-slate-300 bg-white/95 px-3 py-2 text-sm text-slate-700 dark:border-white/20 dark:bg-white/10 dark:text-slate-100">
                                    <option value="">No template selected (Q&A mode)</option>
                                </select>
                                <input
                                    type="file"
                                    id="template-file"
                                    accept=".txt,.docx"
                                    class="text-sm file:mr-3 file:rounded-full file:border-0 file:bg-slate-200 file:px-3 file:py-1.5 file:text-sm file:font-semibold file:text-slate-700 dark:file:bg-white/15 dark:file:text-slate-100"
                                    title="Optional: upload a template file for this prompt"
                                >
                            </div>

                            <div class="prompt-field">
                                <label for="prompt-input" class="sr-only">Prompt</label>
                                <textarea id="prompt-input" rows="3" placeholder="Send a prompt" class="prompt-input"></textarea>
                                <button type="submit" id="submit-button" class="prompt-send-button inline-flex items-center justify-center gap-2 rounded-full bg-brand-foam text-white dark:text-brand-ink font-semibold" data-state="idle">
                                    <span data-role="label">Send prompt</span>
                                    <svg data-role="spinner" class="hidden h-5 w-5 animate-spin text-white" viewBox="0 0 24 24" aria-hidden="true">
                                        <circle class="opacity-20" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                                        <path class="opacity-80" fill="currentColor" d="M4 12a8 8 0 0 1 8-8v4a4 4 0 0 0-4 4H4Z"></path>
                                    </svg>
                                </button>
                            </div>
                        </form>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <script src="script.js" defer></script>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
